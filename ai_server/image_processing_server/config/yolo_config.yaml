# YOLO 분석 서버 설정
# 모델 교체 시 model_path 와 class_names 만 수정하면 됩니다.

# YOLO 모델 파일 경로 (.pt)
# 예: "yolov8n.pt" (사전학습), "best.pt" (커스텀 학습)
model_path: "/home/addinedu/Documents/roscamp-repo-1/ai_server/image_processing_server/image_processing/best_ng_20260223.pt"

# 클래스 이름 리스트 (모델 학습 시 사용한 순서와 동일해야 함)
# 사전학습 COCO 모델 사용 시 ultralytics 데이터셋 클래스명을 사용
class_names:
  - "Hamcheese"
  - "Mushroom"
  - "All-in-one"
  - "NG"

# 추론 옵션
inference:
  conf_threshold: 0.25   # 최소 신뢰도
  iou_threshold: 0.45    # NMS IOU 임계값
  stream: true           # stream=True 로 프레임별 처리 (기존 opencv_yolov8 와 동일)
