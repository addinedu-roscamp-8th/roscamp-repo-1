<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Order - 테스트 GUI</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 16px; max-width: 640px; }
    h1 { font-size: 1.25rem; }
    section { margin-bottom: 24px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input[type="text"], textarea { width: 100%; padding: 8px; margin-bottom: 8px; }
    button { padding: 8px 16px; margin-right: 8px; margin-bottom: 8px; cursor: pointer; }
    .log { background: #f5f5f5; padding: 8px; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .error { color: #c00; }
    audio { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Voice Order API - 테스트 GUI</h1>
  <p>Base URL: <input type="text" id="baseUrl" value="http://localhost:8000" style="width: 280px;"> <button type="button" id="btnSaveUrl">적용</button></p>

  <section>
    <h2>1. STT (음성 → 텍스트)</h2>
    <button type="button" id="btnRecord">녹음 시작</button>
    <button type="button" id="btnStopRecord" disabled>녹음 중지</button>
    <p id="sttStatus"></p>
    <p><strong>인식 결과:</strong> <span id="sttResult">-</span></p>
  </section>

  <section>
    <h2>2. TTS (텍스트 → 음성)</h2>
    <label>텍스트</label>
    <textarea id="ttsText" rows="2">안녕하세요, 주문을 도와드리겠습니다.</textarea>
    <button type="button" id="btnTts">TTS 재생</button>
    <audio id="ttsAudio" controls></audio>
  </section>

  <section>
    <h2>3. 웨이크업 (텍스트 판별)</h2>
    <label>문장 입력</label>
    <input type="text" id="wakewordText" value="여기 주문이요." placeholder="예: 여기 주문이요.">
    <button type="button" id="btnWakeword">웨이크업 판별</button>
    <p><strong>결과:</strong> <span id="wakewordResult">-</span></p>
  </section>

  <section>
    <h2>4. 펑션 콜링 (테스트)</h2>
    <button type="button" id="btnFunctionCall">test_voice_order 호출</button>
    <p><strong>결과:</strong> <span id="functionCallResult">-</span></p>
  </section>

  <section>
    <h2>5. 파이프라인 (오디오 → STT → 웨이크업 → 펑션 → TTS)</h2>
    <button type="button" id="btnPipelineRecord">녹음 후 파이프라인</button>
    <button type="button" id="btnPipelineStop" disabled>중지</button>
    <p id="pipelineStatus"></p>
    <p><strong>응답 텍스트:</strong> <span id="pipelineReply">-</span></p>
    <audio id="pipelineAudio" controls></audio>
  </section>

  <section>
    <h2>로그</h2>
    <div id="log" class="log"></div>
  </section>

  <script>
    (function () {
      const DEFAULT_BASE = "http://localhost:8000";
      let baseUrl = localStorage.getItem("voiceOrderBaseUrl") || DEFAULT_BASE;
      document.getElementById("baseUrl").value = baseUrl;

      let mediaRecorder = null;
      let audioChunks = [];

      function getBase() {
        return baseUrl.replace(/\/$/, "");
      }
      function log(msg, isError) {
        const el = document.getElementById("log");
        const line = "[" + new Date().toLocaleTimeString() + "] " + msg + "\n";
        el.textContent = (isError ? "ERROR: " : "") + line + el.textContent;
        if (isError) el.classList.add("error");
      }

      document.getElementById("btnSaveUrl").onclick = function () {
        baseUrl = document.getElementById("baseUrl").value.trim() || DEFAULT_BASE;
        localStorage.setItem("voiceOrderBaseUrl", baseUrl);
        log("Base URL 설정: " + baseUrl);
      };

      // STT: 녹음 후 POST /stt/
      document.getElementById("btnRecord").onclick = async function () {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => e.data.size && audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach((t) => t.stop());
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            document.getElementById("sttStatus").textContent = "업로드 중...";
            const fd = new FormData();
            fd.append("file", blob, "audio.webm");
            const r = await fetch(getBase() + "/stt/", { method: "POST", body: fd });
            if (!r.ok) throw new Error(await r.text());
            const data = await r.json();
            document.getElementById("sttResult").textContent = data.text || "(없음)";
            document.getElementById("sttStatus").textContent = "완료";
            log("STT: " + (data.text || "(empty)"));
          };
          mediaRecorder.start();
          document.getElementById("btnRecord").disabled = true;
          document.getElementById("btnStopRecord").disabled = false;
          document.getElementById("sttStatus").textContent = "녹음 중...";
        } catch (e) {
          log(e.message, true);
          document.getElementById("sttStatus").textContent = "오류: " + e.message;
        }
      };
      document.getElementById("btnStopRecord").onclick = function () {
        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
        document.getElementById("btnRecord").disabled = false;
        document.getElementById("btnStopRecord").disabled = true;
      };

      // TTS
      document.getElementById("btnTts").onclick = async function () {
        const text = document.getElementById("ttsText").value.trim();
        if (!text) return;
        try {
          const r = await fetch(getBase() + "/tts/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text }),
          });
          if (!r.ok) throw new Error(await r.text());
          const blob = await r.blob();
          const url = URL.createObjectURL(blob);
          document.getElementById("ttsAudio").src = url;
          log("TTS 완료");
        } catch (e) {
          log(e.message, true);
          document.getElementById("ttsAudio").innerHTML = "";
        }
      };

      // Wakeword
      document.getElementById("btnWakeword").onclick = async function () {
        const text = document.getElementById("wakewordText").value.trim();
        if (!text) return;
        try {
          const r = await fetch(getBase() + "/wakeword/check/text", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text, use_llm: true }),
          });
          if (!r.ok) throw new Error(await r.text());
          const data = await r.json();
          const msg = "is_wake=" + data.is_wake + (data.intent ? ", intent=" + data.intent : "");
          document.getElementById("wakewordResult").textContent = msg;
          log("Wakeword: " + msg);
        } catch (e) {
          log(e.message, true);
          document.getElementById("wakewordResult").textContent = "오류: " + e.message;
        }
      };

      // Function call
      document.getElementById("btnFunctionCall").onclick = async function () {
        try {
          const r = await fetch(getBase() + "/functions/call", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ function_name: "test_voice_order", arguments: { source: "gui" } }),
          });
          if (!r.ok) throw new Error(await r.text());
          const data = await r.json();
          document.getElementById("functionCallResult").textContent = data.success ? data.message : data.message;
          log("Function call: " + JSON.stringify(data));
        } catch (e) {
          log(e.message, true);
          document.getElementById("functionCallResult").textContent = "오류: " + e.message;
        }
      };

      // Pipeline: record then POST /pipeline/run
      document.getElementById("btnPipelineRecord").onclick = async function () {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => e.data.size && audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach((t) => t.stop());
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            document.getElementById("pipelineStatus").textContent = "파이프라인 실행 중...";
            const fd = new FormData();
            fd.append("file", blob, "audio.webm");
            const r = await fetch(getBase() + "/pipeline/run?tts_reply=true", { method: "POST", body: fd });
            if (!r.ok) throw new Error(await r.text());
            const data = await r.json();
            document.getElementById("pipelineReply").textContent = data.reply_text || "-";
            if (data.tts_audio_base64) {
              document.getElementById("pipelineAudio").src = "data:audio/mpeg;base64," + data.tts_audio_base64;
            }
            document.getElementById("pipelineStatus").textContent = "완료. STT: " + (data.stt_text || "");
            log("Pipeline: " + (data.stt_text || "") + " -> " + (data.reply_text || ""));
          };
          mediaRecorder.start();
          document.getElementById("btnPipelineRecord").disabled = true;
          document.getElementById("btnPipelineStop").disabled = false;
          document.getElementById("pipelineStatus").textContent = "녹음 중...";
        } catch (e) {
          log(e.message, true);
          document.getElementById("pipelineStatus").textContent = "오류: " + e.message;
        }
      };
      document.getElementById("btnPipelineStop").onclick = function () {
        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
        document.getElementById("btnPipelineRecord").disabled = false;
        document.getElementById("btnPipelineStop").disabled = true;
      };
    })();
  </script>
</body>
</html>
