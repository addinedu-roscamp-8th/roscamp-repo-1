# 웨이크업 워드 레퍼런스 (주문 시작 의도)
# ORDER_START 판별 시 참고하는 발화 문장 목록

description: "주문 하기 의도별 발화 문장 레퍼런스"

categories:
  direct:
    name: "직접적인 주문 요청 (Direct)"
    phrases:
      - "여기 주문이요."
      - "저기요, 주문할게요."
      - "지금 주문 가능할까요?"
      - "샌드위치 주문 좀 받아줘."
      - "주문 시작할게."
      - "샌드위치 하나 주문하고 싶어요."
      - "주문 프로세스 진행해줘."
      - "나 지금 배고픈데 주문 좀 할게."

  menu_specific:
    name: "메뉴 지정형 요청 (Menu-Specific)"
    phrases:
      - "샌드위치 주문할게요."
      - "에그 마요 샌드위치 하나 주문해 줘."
      - "오늘의 샌드위치로 주문할게."
      - "평소 먹던 걸로 주문 넣어줘."
      - "샌드위치 세트 메뉴 주문할 수 있을까?"

  system_oriented:
    name: "음성 인터페이스 타겟팅 (System-Oriented)"
    phrases:
      - "음성 인터페이스로 주문할게요."
      - "보이스 오더 시작해줘."
      - "기계로 주문하고 싶어요."
      - "샌드위치 앱 실행해서 주문 받아줘."
      - "주문 모드 켜줘."

  contextual:
    name: "상황 및 속도 강조형 (Contextual)"
    phrases:
      - "빨리 주문하고 싶어요."
      - "지금 바로 주문할 수 있어?"
      - "포장 주문 좀 도와줘."
      - "매장에서 먹고 갈 건데 주문할게."
      - "예약 주문 좀 받아줄래?"

  conversational:
    name: "부드러운 구어체 및 변칙 (Conversational)"
    phrases:
      - "저기, 주문 좀 받아주시겠어요?"
      - "샌드위치 먹으려는데 주문 어떻게 해?"
      - "주문할 준비 됐어요."
      - "내 목소리 들려? 주문할게."
      - "샌드위치 하나 사려고 하는데."
      - "메뉴 고정했어, 주문 받아줘."
      - "샌드위치 주문 도와줄 수 있니?"

