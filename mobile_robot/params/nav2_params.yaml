amcl:
  ros__parameters:
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 0.5  # 소형 맵(1.5m x 1.0m)에 맞게 2.0 → 0.5로 축소
    laser_max_range: 3.0  # 실제 라이다 최대 거리에 맞게 100.0 → 3.0으로 설정
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000  # 정밀한 위치 추정을 위해 증가
    min_particles: 500  # 정밀한 위치 추정을 위해 증가
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1  # 작은 맵이므로 더 정밀하게 0.2 → 0.1
    tf_broadcast: true
    transform_tolerance: 0.5  # tolerance 감소 1.0 → 0.5
    update_min_a: 0.05  # 2.9도 회전마다 업데이트 (정밀)
    update_min_d: 0.01  # 1cm 이동마다 업데이트 (정밀)
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # Initial pose settings (ignored when FMS sets pose via /initialpose topic)
    set_initial_pose: false  # Changed to false - FMS will publish initial pose
    initial_pose: [0, 0, 0]  # Placeholder - actual pose from FMS

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"

    # 단일 컨트롤러
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    enable_stamped_cmd_vel: false

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05  # 소형 로봇(11cm)에 맞게 0.5 → 0.05로 축소
      movement_time_allowance: 15.0  # 좁은 통로 통과 시간 여유 증가

    # Goal checker
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05  # Goal arrival threshold (5cm) - balances precision and reliability
      yaw_goal_tolerance: 0.1  # 회전 tolerance 0.25 → 0.1로 축소

    # ★ 여기부터: Regulated Pure Pursuit 컨트롤러 설정
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # 기본 속도들 (좁은 통로 통과를 위해 속도 감소)
      desired_linear_vel: 0.15      # [m/s] 좁은 통로용으로 0.20 → 0.15로 감소
      max_linear_accel: 0.1         # [m/s^2] 0.5 → 0.1로 감소
      max_linear_decel: 0.1         # [m/s^2] 0.5 → 0.1로 감소
      max_angular_vel: 0.8          # [rad/s] 소형 맵용 1.0 → 0.8로 감소

      # 경로 추종 관련 (소형 로봇/맵에 맞게 축소)
      lookahead_dist: 0.08  # 0.6 → 0.08로 축소
      min_lookahead_dist: 0.04  # 0.3 → 0.04로 축소
      max_lookahead_dist: 0.15  # 0.9 → 0.15로 축소
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      use_interpolation: true

      # ========= 회전 우선 관련 핵심 파라미터 =========
      # 1) 경로 헤딩과 로봇 헤딩 차이가 나면, 먼저 in-place 회전
      use_rotate_to_heading: true

      # 2) 이 각도(rad) 이상 헤딩 차이가 나면 회전 모드 진입
      #    0.785 ≒ 45도, 0.523 ≒ 30도, 0.35 ≒ 20도
      rotate_to_heading_min_angle: 0.35

      # 3) 회전 속도 (in-place 회전일 때 angular vel)
      rotate_to_heading_angular_vel: 1.0

      # 4) 회전할 때는 전진 속도 0에 가깝게 (거의 제자리 회전)
      max_angular_accel: 3.2
      allow_reversing: false
      use_rotate_to_heading_threshold: 0.15  # 헤딩 오차 이내면 전진으로 전환

      # ========= goal 근처에서 고개 맞추기 =========
      final_rotation_alpha: 1.0
      allow_final_rotation: true
      use_final_rotation: true

      # ========= 안전 관련 (좁은 통로용으로 완화) =========
      # 장애물과 너무 가까워지면 속도 줄이거나 정지하는 옵션들
      use_approach_velocity_scaling: true  # 장애물 근처에서 속도 조절 활성화
      min_approach_linear_velocity: 0.05  # 장애물 근처 최소 속도 (5cm/s)
      inflation_cost_scaling_factor: 1.0  # 좌표맵 비용에 따른 속도 조절 활성화
      regulated_linear_scaling_min_radius: 0.15  # 회전 반지름 (15cm)
      regulated_linear_scaling_min_speed: 0.05  # 최소 속도 (5cm/s)
      use_cost_regulated_linear_velocity_scaling: true  # 비용 기반 속도 조절 활성화
      cost_scaling_dist: 0.3  # 비용 계산 거리 (30cm)
      cost_scaling_gain: 2.0  # 비용 스케일링 게인


local_costmap:
  local_costmap:
    ros__parameters:
      # ========= SC-179: 센서 데이터 수집 - 업데이트 빈도 =========
      update_frequency: 30.0  # 30Hz로 증가 (센서 데이터 처리 빈도 향상)
      publish_frequency: 20.0  # 20Hz로 증가 (주기적 발행)
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # Costmap 크기: 1m x 1m (작은 로컬 맵)
      width: 100  # 100 * 0.01m = 1m (해상도 0.01m)
      height: 100  # 100 * 0.01m = 1m
      resolution: 0.01  # 맵 해상도 1cm (고해상도 장애물 감지)
      robot_radius: 0.055  # 실제 로봇 반지름 (5.5cm)
      # footprint: '[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]'
      # ========= SC-180: 장애물 감지 알고리즘 =========
      plugins: ["obstacle_layer", "inflation_layer"]  # obstacle_layer: 동적 장애물 감지
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ========= SC-180: 회피 경로 계획 - 비용 스케일링 =========
        cost_scaling_factor: 1.0  # 1.0: 자유공간에서 0으로, 장애물에서 254로 점진적 증가
        inflation_radius: 0.08  # 8cm (robot_radius 5.5cm + 2.5cm 안전 여유)
        inflate_unknown: false  # 미지영역 팽창 비활성화
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_padding: 0.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          # Clearing: 빔 뒤의 영역을 자유공간으로 표시 (동적 장애물 감지)
          clearing: True
          # Marking: 빔이 통과한 장애물을 표시 (새로운 장애물 감지)
          marking: True
          data_type: "LaserScan"
          # Raytracing: 레이저 범위 내에서 자유공간 계산
          raytrace_max_range: 0.8  # 광선 추적 최대 거리 (80cm) - 좁은 공간에서 정밀 감지
          raytrace_min_range: 0.0
          # Obstacle detection: 장애물로 표시될 최대 거리
          obstacle_max_range: 0.5  # 장애물 최대 감지 거리 (50cm)
          obstacle_min_range: 0.0
          # 동적 장애물 감지를 위한 타임스탬프 필터
          expected_update_rate: 20.0  # 스캔 예상 업데이트 빈도 (20Hz)
          observation_persistence: 0.0  # 이전 스캔 유지 안함 (최신 스캔만)
      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # ========= SC-179: 센서 데이터 수집 - 글로벌 맵 설정 =========
      footprint_padding: 0.00  # 좁은 틈 통과용으로 패딩 제거
      update_frequency: 2.0  # 2Hz (정적 맵이므로 낮은 빈도)
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.055  # 실제 로봇 반지름 (5.5cm)
      # footprint: '[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]'
      resolution: 0.01  # 맵 해상도 1cm
      track_unknown_space: true
      # ========= SC-181: 회피 경로 계획 =========
      plugins: ["static_layer", "inflation_layer"]  # 정적 맵 + 팽창 레이어
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0  # 선형 비용 증가 (안전하게)
        inflation_radius: 0.10  # 10cm (robot_radius 5.5cm + 4.5cm 경로 계획 여유)
        inflate_unknown: false
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # ========= SC-181: 회피 경로 계획 - 경로 재계획 =========
    expected_planner_frequency: 20.0  # 20Hz 경로 재계획
    planner_plugins: ["GridBased"]
    # Costmap 업데이트 대기 시간 (동적 장애물 감지)
    costmap_update_timeout: 0.5  # 500ms (빠른 재계획)
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.02  # 정밀한 경로 계획 (2cm, 맵 해상도 대비 2픽셀)
      use_astar: true  # A* 알고리즘 (Dijkstra보다 빠름 - 효율적)
      allow_unknown: false  # 미지 영역 회피 (안전)

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Recovery behaviors를 우선순위 순으로 정렬 (안전 정지 우선)
    behavior_plugins: ["wait", "backup", "spin", "drive_on_heading", "assisted_teleop"]

    # Wait: 장애물 소멸 대기 (최우선)
    wait:
      plugin: "nav2_behaviors::Wait"
      wait_duration: 2.0  # 2초 대기

    # Backup: 후진 회피 (5cm 후진)
    backup:
      plugin: "nav2_behaviors::BackUp"
      backup_dist: 0.05  # 5cm 후진
      backup_speed: 0.1  # 10cm/s 속도

    # Spin: 회전 회피 (제자리 회전)
    spin:
      plugin: "nav2_behaviors::Spin"
      spin_dist: 1.57  # π/2 라디안 (90도 회전)
      spin_speed: 0.5  # 50도/s

    # Drive on heading: 특정 방향으로 전진
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      speed: 0.1
      distance: 0.1

    # Assisted teleop: 원격 조종 지원
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    # 충돌 예측 시간 감소 (빠른 반응)
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 1.2]  # 좁은 통로용으로 최대 속도 감소 [0.25→0.20, 1.5→1.2]
    min_velocity: [-0.15, 0.0, -1.0]  # [-0.25→-0.15, -1.5→-1.0]
    max_accel: [1.5, 0.0, 2.5]  # 가속도도 소형 로봇에 맞게 조정 [2.5→1.5, 3.2→2.5]
    max_decel: [-1.5, 0.0, -2.5]  # [-2.5→-1.5, -3.2→-2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
