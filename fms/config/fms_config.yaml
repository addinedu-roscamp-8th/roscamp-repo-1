# Fleet Management System Configuration

# Robot Fleet Configuration
# NOTE: Using ROS_DOMAIN_ID for robot isolation, NOT namespaces
robots:
  - robot_id: "pinky1"
    domain_id: 11
    type: "SERVING_BOT_1"
    parking_spot: "pinky1_spot"
    ip_address: "192.168.1.7"
    enabled: true
  - robot_id: "pinky2"
    domain_id: 12
    type: "SERVING_BOT_2"
    parking_spot: "pinky2_spot"
    ip_address: "192.168.1.6"
    enabled: true
  - robot_id: "pinky3"
    domain_id: 13
    type: "SERVING_BOT_3"
    parking_spot: "pinky3_spot"
    ip_address: "192.168.1.11"
    enabled: true

# Map Positions (in meters, based on map frame)
