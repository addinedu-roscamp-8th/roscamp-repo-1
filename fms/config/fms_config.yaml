# Fleet Management Parameters
parameters:
  # Task assignment frequency (Hz)
  assignment_frequency: 2.0

  # Fleet status publish frequency (Hz)
  status_publish_frequency: 1.0

  # Navigation goal distance threshold (meters)
  goal_reached_threshold: 0.1

  # Low battery threshold (volts)
  low_battery_threshold: 0.0

  # Zone reservation timeout (seconds)
  zone_reservation_timeout: 30.0

  # Auto-set initial pose on startup (enables AMCL localization)
  auto_set_initial_pose: true

# Initial Poses for AMCL Localization
# Set robot initial positions when FMS starts (parking spots)
initial_poses:
  pinky1:
    x: 0.585
    y: 0.085
    theta: 0.0
  pinky2:
    x: 0.585
    y: 0.255
    theta: 0.0
  pinky3:
    x: 0.585
    y: 0.915
    theta: 0.0
