# Domain Bridge Configuration for pinky3
# pinky3 (DOMAIN_ID=13) <-> Main PC (DOMAIN_ID=25)
#
# 사용법:
#   ROS_DOMAIN_ID=25 ros2 run domain_bridge domain_bridge fms/config/domain_bridge_pinky3.yaml

name: pinky3_bridge
from_domain: 13
to_domain: 25

topics:
  # Robot -> FMS: AMCL Pose (로봇 위치)
  amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: pinky3/amcl_pose

  # Robot -> FMS: Battery voltage
  battery/voltage:
    type: std_msgs/msg/Float32
    remap: pinky3/battery/voltage

  # Robot -> FMS: Battery present
  battery/present:
    type: std_msgs/msg/Bool
    remap: pinky3/battery/present

  # FMS -> Robot: Initial pose setting
  pinky3/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: initialpose
    reversed: true

services:
  # Lifecycle services for nav2
  lifecycle_manager_navigation/get_state:
    type: lifecycle_msgs/srv/GetState
    remap: pinky3/lifecycle_manager_navigation/get_state

actions:
  # FMS -> Robot: FollowWaypoints navigation action
  pinky3/follow_waypoints:
    type: nav2_msgs/action/FollowWaypoints
    remap: follow_waypoints
    reversed: true

  # FMS -> Robot: NavigateToPose navigation action
  pinky3/navigate_to_pose:
    type: nav2_msgs/action/NavigateToPose
    remap: navigate_to_pose
    reversed: true
